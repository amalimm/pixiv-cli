# Fork-local build helper. Not part of the upstream contribution in
# fix/mcp-input-schema-required-null.
#
# Builds a Windows amd64 binary from this fork so the input-schema fix can be
# exercised before upstream ships a release carrying it. The committed Rust
# ugoira staticlib is linked directly (see
# internal/media/ugoira/rust_link_windows_amd64.go), so no Rust toolchain is
# needed here.
#
# Delete this file once an official pixiv-cli release includes the fix and the
# MCP registration points back at FlanChanXwO/pixiv-cli.
name: Build Windows artifact (fork-local)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-windows-artifact.yml'
      - 'cmd/**'
      - 'internal/**'
      - 'sdk/**'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    env:
      # The committed ugoira staticlib is an MSVC import library, so the link
      # must go through an MSVC-ABI toolchain. Two things go wrong otherwise:
      # the runner ships MinGW gcc ahead of MSVC on PATH and cgo picks it, and
      # plain cl rejects the gcc-style /Werror that cgo passes. The upstream
      # ci/platforms.json uses clang -fuse-ld=lld for Windows; mirror that.
      CC: clang -fuse-ld=lld
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build
        shell: pwsh
        env:
          # Matches scripts/build-platform.sh. Without it the binary reports
          # "pixiv dev" and the install is indistinguishable from a stray build.
          # The v prefix is required: internal/update/release parses the stamp
          # with ParseSemanticVersion and warns on every invocation without it.
          PIXIV_FORK_VERSION: v1.1.1+pixiv-fork.1
        run: |
          go env CC
          go build -trimpath -buildvcs=false `
            -ldflags "-X github.com/FlanChanXwO/pixiv-cli/internal/shared/buildinfo.Version=$env:PIXIV_FORK_VERSION" `
            -o pixiv.exe ./cmd/pixiv
          .\pixiv.exe --version

      - uses: actions/upload-artifact@v4
        with:
          name: pixiv-windows-amd64
          path: pixiv.exe
          if-no-files-found: error